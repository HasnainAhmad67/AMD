# uv workspace root (virtual — nothing is built from here).
#   uv sync                     -> ML (inference + training utils) + API + dev tools
#   uv sync --extra torch       -> also installs torch for training the sound autoencoder
# Plain pip works too:  pip install -e "./ml[train,dev]" -e "./apps/api[dev]"
[project]
name = "telltale-workspace"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["telltale-ml[train]", "telltale-api"]

[project.optional-dependencies]
torch = ["telltale-ml[torch]"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "httpx>=0.27", "uvicorn[standard]>=0.30"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["ml", "apps/api"]

[tool.uv.sources]
telltale-ml = { workspace = true }
telltale-api = { workspace = true }

[tool.vercel]
entrypoint = "index:app"
