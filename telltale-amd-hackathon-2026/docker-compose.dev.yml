# Hot-reload development overlay.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# API: http://localhost:8000/docs (uvicorn --reload)   Web: http://localhost:5173 (Vite HMR)

services:
  api:
    build:
      target: dev
    environment:
      TELLTALE_ENV: dev
      TELLTALE_SIMULATOR_INTERVAL_S: "2"
      # File-change events don't cross from Windows/macOS into containers; poll instead.
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./ml:/app/ml
      - ./apps/api:/app/apps/api
      - ./models:/models
      - ./data/samples:/data/samples:ro
      - ./data/state:/data/state
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  web:
    build:
      target: dev
    environment:
      VITE_API_PROXY: http://api:8000
      VITE_USE_POLLING: "true"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    ports: !override
      - "${DEV_WEB_PORT:-5173}:5173"
